{{define "head"}}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Система обучения сотрудников</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f6;color:#172638;font:1rem/1.55 system-ui,sans-serif}
header{background:#122f45;color:white;padding:1rem max(1rem,calc((100% - 56rem)/2));font-weight:700}
main{width:min(56rem,calc(100% - 2rem));margin:2rem auto}section{background:white;border:1px solid #d2dde5;border-radius:12px;padding:clamp(1rem,4vw,2rem);margin-bottom:1rem}
h1,h2,h3{line-height:1.2}h1{margin-top:0}a{color:#075b78}form{margin:1rem 0}label{display:block;margin:.5rem 0}
input,select,button{font:inherit;max-width:100%}input:not([type=radio]),select{padding:.5rem;border:1px solid #8498a7;border-radius:5px}
button{background:#07546b;color:white;border:0;border-radius:6px;padding:.5rem 1rem;cursor:pointer}
fieldset{border:1px solid #d2dde5;border-radius:6px;margin:1rem 0;padding:1rem}progress{accent-color:#087059;width:min(100%,22rem)}
.table{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:.6rem;border-bottom:1px solid #d2dde5}
</style>
</head><body><header>Система обучения сотрудников</header><main>{{end}}
{{define "foot"}}</main></body></html>{{end}}
{{define "home"}}{{template "head"}}<section><h1>Приёмка товара</h1><p>Учебный курс для сотрудников склада.</p></section>{{template "foot"}}{{end}}
